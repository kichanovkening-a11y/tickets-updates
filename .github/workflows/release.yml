name: Build and publish Tickets
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'data/**', 'version.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tickets-release-serial
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.408
      - name: Restore test data
        run: python scripts/restore_seed.py
      - name: Verify Windows editor controls
        timeout-minutes: 8
        env:
          TICKETS_UI_CAPTURE_DIR: ${{ github.workspace }}/ui-captures
        run: |
          dotnet run --project tests/Tickets.UiChecks/Tickets.UiChecks.csproj -- data/seed.db --corrections033
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets-ui-captures
          path: ui-captures/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Test accounting and updater
        run: dotnet run --project tests/Tickets.Tests/Tickets.Tests.csproj -- data/seed.db --corrections033
      - name: Verify document corrections
        run: dotnet run --project tests/Tickets.Tests/Tickets.Tests.csproj -- data/seed.db --documents035
      - name: Verify matching regression
        run: dotnet run --project tests/Tickets.Tests/Tickets.Tests.csproj -- data/seed.db --corrections032
      - name: Publish portable Windows app
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          dotnet publish src/Tickets.App/Tickets.App.csproj -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.32 "-p:Version=$v" -o release/Tickets
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Start application on Windows
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          $exe = (Resolve-Path release/Tickets/Tickets.exe).Path
          $p = Start-Process $exe -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { throw "Application exited: $($p.ExitCode)" }
              if ($p.MainWindowHandle -ne 0 -and $p.MainWindowTitle -eq "Билеты · $v") { $ready=$true; break }
            }
            if (-not $ready) { throw 'Main window did not open' }
            Write-Host "Windows main window opened: $($p.MainWindowTitle)"
            $null=$p.CloseMainWindow()
            if (-not $p.WaitForExit(10000)) { throw 'Application did not close normally' }
          } finally { if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() } }
      - name: Create release packages
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          python scripts/package_release.py release/Tickets release-assets $env:GITHUB_REPOSITORY $v
          if ($LASTEXITCODE -ne 0) { throw 'Update packaging failed' }
          python scripts/package_portable.py release/Tickets release-assets/Tickets-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release revision' }
          if ($head -ne $env:GITHUB_SHA) { Write-Host 'Newer revision is queued; skip stale release'; exit 0 }
          $v = (Get-Content version.json | ConvertFrom-Json).version
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            git fetch --depth=1 origin tag $tag
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect published tag' }
            git diff --quiet $tag HEAD -- src scripts data version.json RELEASE-NOTES.md
            if ($LASTEXITCODE -eq 0) { Write-Host 'Application is already published; only checks or workflow changed'; exit 0 }
            throw 'Version already published: increment version.json'
          }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Билеты $v" --notes-file RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
