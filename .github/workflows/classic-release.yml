name: Publish classic Tickets
# Change version-classic.json only after the user authorizes this particular release.
on:
  push:
    branches: [visual/classic]
    paths: [version-classic.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: tickets-classic-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reuse completed checks only for identical application sources
        id: cached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($tested in @('4724c2f57cc6a3768e2cd22fd7c369cf443789c4','902183a24a546ae1bd91a1d2531e5aa594db7a9a')) {
            git fetch --no-tags --depth=1 origin $tested
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tested sources' }
            git diff --quiet $tested HEAD -- src tests data scripts
            if ($LASTEXITCODE -eq 1) { Write-Host 'Application changed; run checks again'; exit 0 }
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare tested sources' }
          }
          $core = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/136493648080" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify accounting checks' }
          $check = $core.steps | Where-Object name -eq 'Verify accounting halls documents and integrations on Windows'
          if ($check.conclusion -eq 'success') { 'core=true' >> $env:GITHUB_OUTPUT }
          $ui = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/136481093814" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify classic interface checks' }
          if ($ui.conclusion -eq 'success') { 'ui=true' >> $env:GITHUB_OUTPUT }
      - name: Verify accounting halls documents and integrations on Windows
        if: steps.cached.outputs.core != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path data/seed.db)) {
            python scripts/restore_seed.py
            if ($LASTEXITCODE -ne 0) { throw 'Seed restore failed' }
          }
          dotnet run --project tests/Tickets.Tests -- data/seed.db
          if ($LASTEXITCODE -ne 0) { throw 'Accounting, halls, documents and integration checks failed' }
      - name: Verify classic menus windows search printing and saved modes
        if: steps.cached.outputs.ui != 'true'
        shell: pwsh
        run: |
          dotnet run --project tests/Tickets.UiChecks -p:ClassicVisual=true -- data/seed.db --classic-parity
          if ($LASTEXITCODE -ne 0) { throw 'Classic functional parity failed' }
      - name: Build classic application and updater
        shell: pwsh
        run: |
          $v = (Get-Content version-classic.json | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid classic version' }
          "CLASSIC_VERSION=$v" >> $env:GITHUB_ENV
          if (-not (Test-Path data/seed.db)) {
            python scripts/restore_seed.py
            if ($LASTEXITCODE -ne 0) { throw 'Seed restore failed' }
          }
          dotnet run --project tests/Tickets.UpdateChecks -- --classic-channel
          if ($LASTEXITCODE -ne 0) { throw 'Classic updater checks failed' }
          dotnet publish src/Tickets.App/Tickets.App.csproj -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.32 -p:ClassicVisual=true "-p:Version=$v" -o release/Tickets-Classic
          if ($LASTEXITCODE -ne 0) { throw 'Classic app build failed' }
          dotnet publish src/Tickets.Updater/Tickets.Updater.csproj -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.32 -p:ClassicVisual=true "-p:Version=$v" -o release/Tickets-Classic
          if ($LASTEXITCODE -ne 0) { throw 'Classic updater build failed' }
      - name: Verify one installation with preserved data and healthy startup
        shell: pwsh
        run: ./scripts/check_updater_windows.ps1 -Payload (Resolve-Path release/Tickets-Classic).Path -Seed (Resolve-Path data/seed.db).Path -Classic
      - name: Package classic updates and first installation
        shell: pwsh
        run: |
          python scripts/package_release.py release/Tickets-Classic release-assets $env:GITHUB_REPOSITORY $env:CLASSIC_VERSION --classic
          if ($LASTEXITCODE -ne 0) { throw 'Classic update packaging failed' }
          python scripts/package_portable.py release/Tickets-Classic release-assets/Tickets-Classic-Windows-x64.zip --classic
          if ($LASTEXITCODE -ne 0) { throw 'Classic portable packaging failed' }
          dotnet publish src/Tickets.Updater/Tickets.Updater.csproj -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.32 -p:ClassicVisual=true "-p:Version=$env:CLASSIC_VERSION" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Classic bootstrap build failed' }
          Copy-Item release/bootstrap/Tickets.Classic.Updater.exe release-assets/Tickets-Classic-Update.exe
      - name: Verify standalone updater for previously issued classic builds
        shell: pwsh
        run: ./scripts/check_updater_windows.ps1 -Payload (Resolve-Path release/Tickets-Classic).Path -Seed (Resolve-Path data/seed.db).Path -Classic -Bootstrap (Resolve-Path release-assets/Tickets-Classic-Update.exe).Path
      - name: Publish classic channel without changing standard updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/visual/classic" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Classic release revision changed' }
          $tag = "classic-v$env:CLASSIC_VERSION"
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Билеты: классический вид $env:CLASSIC_VERSION" --notes 'Классическая версия. Обновление через кнопку с сохранением данных и оформления.' --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Classic release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Classic release publication failed' }
          gh release view classic --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create classic --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Обновления классической версии' --notes 'Канал обновления классической версии.' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Classic channel creation failed' }
          }
          # All immutable versioned assets are available before changing the channel pointer.
          gh release upload classic release-assets/update-manifest.json --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Classic channel manifest upload failed' }
