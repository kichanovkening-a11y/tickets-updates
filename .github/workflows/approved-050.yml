name: Verify poster chooser
on:
  push:
    branches: [verify/poster-choice-0511]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.408
      - run: python scripts/restore_seed.py
      - run: dotnet run --project tests/Tickets.UiChecks -- data/seed.db --poster-choice
